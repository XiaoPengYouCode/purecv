<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureCV - Hough Circles</title>
    <style>
        :root {
            --primary: #fa709a;
            --secondary: #fee140;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            margin: 2rem 0;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .card {
            background: var(--card);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .uploader {
            border: 2px dashed #334155;
            padding: 2rem;
            text-align: center;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .uploader:hover { border-color: var(--primary); background: rgba(250, 112, 154, 0.05); }
        .uploader p { margin: 0; color: #94a3b8; }
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loader" class="loading">
        <p>Initializing WASM...</p>
    </div>

    <div class="container">
        <div class="header">
            <h1>Hough Circle Detection</h1>
            <p>Hough Gradient Method</p>
        </div>

        <div class="card">
            <div id="drop-zone" class="uploader">
                <p>Click or drag image here</p>
                <input type="file" id="file-input" accept="image/*" class="hidden">
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Min Distance: <span id="val-min-dist">20</span></label>
                    <input type="range" id="min-dist" min="1" max="200" value="20">
                </div>
                <div class="control-group">
                    <label>Param 1 (Canny): <span id="val-p1">100</span></label>
                    <input type="range" id="p1" min="1" max="255" value="100">
                </div>
                <div class="control-group">
                    <label>Param 2 (Accum): <span id="val-p2">30</span></label>
                    <input type="range" id="p2" min="1" max="100" value="30">
                </div>
                <div class="control-group">
                    <label>Min Radius: <span id="val-min-r">0</span></label>
                    <input type="range" id="min-r" min="0" max="100" value="0">
                </div>
                <div class="control-group">
                    <label>Max Radius: <span id="val-max-r">0</span></label>
                    <input type="range" id="max-r" min="0" max="500" value="0">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="example_hough_circles.js"></script>
</body>
</html>
