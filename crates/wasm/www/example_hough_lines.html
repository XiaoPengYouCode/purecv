<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PureCV - Hough Lines</title>
    <style>
        :root {
            --primary: #84fab0;
            --secondary: #8fd3f4;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            width: 90%;
            margin: 2rem 0;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .card {
            background: var(--card);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .algo-switch {
            display: flex;
            background: #0f172a;
            padding: 0.25rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
        .algo-switch button {
            flex: 1;
            padding: 0.5rem;
            border: none;
            background: none;
            color: #64748b;
            cursor: pointer;
            border-radius: 0.25rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .algo-switch button.active {
            background: var(--card);
            color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        label {
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
        }
        .canvas-container {
            position: relative;
            display: flex;
            justify-content: center;
            background: #000;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        canvas {
            max-width: 100%;
            height: auto;
        }
        .uploader {
            border: 2px dashed #334155;
            padding: 2rem;
            text-align: center;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .uploader:hover { border-color: var(--primary); background: rgba(132, 250, 176, 0.05); }
        .uploader p { margin: 0; color: #94a3b8; }
        .loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="loader" class="loading">
        <p>Initializing WASM...</p>
    </div>

    <div class="container">
        <div class="header">
            <h1>Hough Line Detection</h1>
            <p>Standard & Probabilistic Transform</p>
        </div>

        <div class="card">
            <div id="drop-zone" class="uploader">
                <p>Click or drag image here</p>
                <input type="file" id="file-input" accept="image/*" class="hidden">
            </div>

            <div class="algo-switch">
                <button id="btn-standard" class="active">Standard (HoughLines)</button>
                <button id="btn-prob">Probabilistic (HoughLinesP)</button>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Threshold: <span id="val-thresh">50</span></label>
                    <input type="range" id="thresh" min="1" max="255" value="50">
                </div>
                <div id="standard-params">
                    <div class="control-group">
                        <label>Rho: <span id="val-rho">1</span></label>
                        <input type="range" id="rho" min="1" max="10" value="1">
                    </div>
                </div>
                <div id="prob-params" class="hidden">
                    <div class="control-group">
                        <label>Min Line Length: <span id="val-min-len">30</span></label>
                        <input type="range" id="min-len" min="1" max="200" value="30">
                    </div>
                </div>
                <div class="control-group">
                    <label>Canny High: <span id="val-canny">150</span></label>
                    <input type="range" id="canny" min="50" max="255" value="150">
                </div>
            </div>
        </div>

        <div class="card">
            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="example_hough_lines.js"></script>
</body>
</html>
